<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & Description (SEO-friendly) -->
    <title>Undangan Pernikahan Digital Elegan: Putra & Siska | Online & Responsive</title>
    <meta name="description" content="Selamat datang di undangan pernikahan online resmi Putra & Siska. Rayakan hari bahagia kami dengan akses mudah, galeri momen indah, dan RSVP online cepat. Buka undangan digital kami sekarang!">
    <meta name="keywords" content="undangan pernikahan digital, undangan online putra siska, digital wedding invitation, e-invitation, undangan website, template undangan pernikahan, vercel github wedding">
    <meta name="author" content="Putra & Siska">

    <!-- Open Graph / Facebook (Sangat Penting untuk Media Sosial) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nainggolanalin.github.io/undangan3/"> <!-- Ganti dengan link Vercel Anda -->
    <meta property="og:title" content="The Wedding of Putra & Siska - Undangan Pernikahan Digital">
    <meta property="og:description" content="Kamu diundang! Buka dan lihat detail acara, waktu, serta lokasi pernikahan kami secara online di sini.">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1tuGLXllH6eqNtkWojc5ziHASStG7u3tb"> <!-- Ganti dengan lokasi gambar thumbnail di atas -->
    <style>
        /* CSS Reset & styling agar iframe penuh di layar tanpa scrollbar ganda */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f8ff; /* Warna senada biru lembut */
            font-family: Arial, sans-serif;
        }

        /* Container Pembungkus */
        .iframe-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Iframe Responsive */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Loader Ringan sebelum halaman termuat sepenuhnya */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #eef2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }

        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #1e88e5;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-screen p {
            margin-top: 12px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading -->
    <div class="loading-screen" id="loader">
        <div class="spinner"></div>
        <p>Memuat Undangan...</p>
    </div>

    <!-- Iframe Konten Webapp -->
    <div class="iframe-container">
        <!-- Ganti src di bawah ini dengan URL Webapp Google Apps Script Anda asli -->
        <iframe 
            src="" 
            src="https://script.google.com/macros/s/AKfycbxyMV8ymKFBPA2TMsLXxUdR6Of3VjZrc1iVDFOEtDcKxS_Uy62B9dyhlyNIm9Eel6DH/exec" 
            title="Undangan Pernikahan Digital Putra & Siska"
            allow="autoplay; geolocation; microphone; camera; midi; encrypted-media;" 
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500); // transisi smooth menghilang
        }
    </script>
</body>
</html>
